[project]
name = "spherical-camera-zenoh-node"
version = "0.1.0"
description = "Publish equirectangular and perspective view streams from a RICOH THETA S over Zenoh"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eclipse-zenoh>=1.9.0",
    "json5>=0.15.0",
    "numpy>=2.5.1",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "ruff>=0.15.21",
]
example = [
    "pygame>=2.6.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["B", "I", "RUF", "SIM", "UP"]
